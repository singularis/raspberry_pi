apiVersion: v1
kind: ServiceAccount
metadata:
  name: lcd-collector
  namespace: lcd-monitor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lcd-collector
  namespace: lcd-monitor
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lcd-collector
  namespace: lcd-monitor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lcd-collector
subjects:
  - kind: ServiceAccount
    name: lcd-collector
    namespace: lcd-monitor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lcd-collector
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lcd-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: lcd-collector
subjects:
  - kind: ServiceAccount
    name: lcd-collector
    namespace: lcd-monitor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lcd-collector-secrets
  namespace: chater-ui
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["chater-ui"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lcd-collector-secrets
  namespace: chater-ui
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lcd-collector-secrets
subjects:
  - kind: ServiceAccount
    name: lcd-collector
    namespace: lcd-monitor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lcd-collector-secrets
  namespace: chater-ui-dev
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["chater-ui-dev"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lcd-collector-secrets
  namespace: chater-ui-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lcd-collector-secrets
subjects:
  - kind: ServiceAccount
    name: lcd-collector
    namespace: lcd-monitor
