apiVersion: apps/v1
kind: Deployment
metadata:
  name: lcd-collector
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: lcd-collector
  template:
    metadata:
      labels:
        app: lcd-collector
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/agent-inject-perms: "0644"
        vault.hashicorp.com/role: {{ .Values.vault.role | quote }}
        vault.hashicorp.com/agent-inject-secret-ssh_key: "homelab/data/ssh/dante"
        vault.hashicorp.com/agent-inject-template-ssh_key: {{ `{{- with secret "homelab/data/ssh/dante" -}}{{ .Data.data.private_key }}{{- end }}` | quote }}
        vault.hashicorp.com/agent-inject-secret-known_hosts: "homelab/data/ssh/known_hosts"
        vault.hashicorp.com/agent-inject-template-known_hosts: {{ `{{- with secret "homelab/data/ssh/known_hosts" -}}{{ .Data.data.content }}{{- end }}` | quote }}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: lcd-collector
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: lcd-collector
                topologyKey: kubernetes.io/hostname
      containers:
        - name: lcd-collector
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8010
              protocol: TCP
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: REFRESH_S
              value: "{{ .Values.refreshSeconds }}"
            - name: NODE_EXPORTER_PORT
              value: "{{ .Values.nodeExporter.port }}"
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              add: ["NET_RAW"]
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir: {}
      tolerations:
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
