replicaCount: 2

image:
  repository: ghcr.io/singularis/lcd-collector
  pullPolicy: Always
  # GitHub Actions replaces this with the short commit sha on main.
  tag: "8cc5249"

namespace: lcd-monitor

service:
  type: LoadBalancer
  port: 8000
  loadBalancerIP: "192.168.0.124"
  externalTrafficPolicy: Local

refreshSeconds: 60

# Node CPU, RAM, disk and temperature. The collector reads each node's :port directly.
nodeExporter:
  image: quay.io/prometheus/node-exporter:v1.12.1
  port: 9100

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 160Mi
