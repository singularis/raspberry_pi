<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LCD monitor</title>
<link rel="stylesheet" href="/static/style.css?v=14">
</head>
<body>
<main class="page">
  <header class="top">
    <p class="mark">LCD monitor</p>
    <h1 id="status">loading</h1>
    <p id="temp" class="weather"></p>
  </header>
  <div id="sections"></div>
  <section class="actsec" id="actsec">
    <h2>Actions</h2>
    <div id="action-list"></div>
  </section>
</main>
<script>
const sections = document.getElementById("sections");
let snap = null;
let sentId = "";
let viewGen = 0;

function summary(s) {
  const n = s.summary || {};
  if (n.crit) return n.crit + " bad";
  if (n.warn) return n.warn + " warn";
  return "all ok";
}

function addRows(parent, rows) {
  const dual = rows.some(function (r) { return r.length > 3; });
  if (dual) {
    const h = document.createElement("div");
    h.className = "row dual head";
    const a = document.createElement("span");
    const b = document.createElement("span");
    b.textContent = "now";
    const c = document.createElement("span");
    c.textContent = "prev";
    h.appendChild(a);
    h.appendChild(b);
    h.appendChild(c);
    parent.appendChild(h);
  }
  rows.forEach(function (r) {
    const d = document.createElement("div");
    d.className = dual ? "row dual" : "row";
    const a = document.createElement("span");
    a.textContent = r[0] || "";
    const b = document.createElement("span");
    b.textContent = r[1] || "";
    b.className = r[2] || "ok";
    d.appendChild(a);
    d.appendChild(b);
    if (dual) {
      const c = document.createElement("span");
      c.textContent = r[3] || "";
      c.className = r[4] || "";
      d.appendChild(c);
    }
    parent.appendChild(d);
  });
}

function paint() {
  if (!snap) return;
  const y = window.scrollY;
  const st = document.getElementById("status");
  st.textContent = summary(snap);
  st.className = (snap.summary && snap.summary.crit) ? "crit" : (snap.summary && snap.summary.warn) ? "warn" : "ok";
  const bits = [];
  if (snap.temp_in) bits.push(snap.temp_in);
  const sensor = snap.sensor || {};
  if (sensor.humidity) bits.push(sensor.humidity);
  if (sensor.pressure) bits.push(sensor.pressure + " hPa");
  if (sensor.gas) bits.push("gas " + sensor.gas);
  if (snap.weather_alert === "severe") bits.push("severe");
  else if (snap.weather_alert === "warn") bits.push("weather");
  if (snap.temp_out) bits.push("out " + snap.temp_out);
  document.getElementById("temp").textContent = bits.join("   ");
  sections.innerHTML = "";
  (snap.tiles || []).forEach(function (t) {
    const sec = document.createElement("section");
    sec.className = "block " + (t.state || "off") + (t.os === "windows" ? " os-windows" : "");
    const head = document.createElement("header");
    const h = document.createElement("h2");
    h.textContent = t.label || "";
    head.appendChild(h);
    const osRow = (t.pages || []).some(function (page) {
      return (page.rows || []).some(function (r) { return r && r[0] === "os"; });
    });
    if (t.os && !osRow) {
      const os = document.createElement("span");
      os.className = "os";
      os.textContent = t.os;
      head.appendChild(os);
    }
    if (t.cap) {
      const cap = document.createElement("span");
      cap.className = "cap";
      cap.textContent = t.cap;
      head.appendChild(cap);
    }
    const big = document.createElement("p");
    big.className = "big";
    big.textContent = t.big || "--";
    head.appendChild(big);
    sec.appendChild(head);
    const rows = document.createElement("div");
    rows.className = "rows";
    (t.pages || []).forEach(function (page) {
      addRows(rows, page.rows || []);
    });
    if (t.camera) {
      const rec = !!t.camera.recording;
      const camRows = [
        ["recording", rec ? "yes" : "no", rec ? "busy" : "ok"],
        ["phase", t.camera.phase || "idle", "ok"]
      ];
      if (rec) {
        const s = t.camera.elapsed_s || 0;
        const mm = String(Math.floor(s / 60)).padStart(2, "0");
        const ss = String(s % 60).padStart(2, "0");
        camRows.push(["time", mm + ":" + ss, "busy"]);
      }
      addRows(rows, camRows);
    }
    sec.appendChild(rows);
    sections.appendChild(sec);
  });
  paintActions();
  window.scrollTo(0, y);
}

function paintActions() {
  const list = document.getElementById("action-list");
  list.innerHTML = "";
  const rows = [];
  (snap.tiles || []).forEach(function (t) {
    (t.pages || []).forEach(function (page) {
      (page.actions || []).forEach(function (act) {
        rows.push({tile: t.label || t.id || "", act: act});
      });
    });
  });
  const skipped = !!snap.shutdown_skipped;
  rows.push({
    tile: "Tonight",
    act: {
      id: "cancel_shutdown",
      label: skipped ? "Off tonight" : "Cancel shutdown",
      enabled: !skipped,
      why: skipped ? "already skipped" : "",
      color: "yellow",
      confirm: {
        title: "Cancel today's shutdown?",
        body: "Skips the 22:00 power-off until midnight, on Windows and on Linux. The power button still shuts the box down."
      }
    }
  });
  rows.forEach(function (row) {
    const act = row.act;
    const line = document.createElement("div");
    line.className = "actrow";
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = act.label;
    b.disabled = !act.enabled;
    if (act.color) b.classList.add(act.color);
    if (act.current) b.classList.add("current");
    const text = document.createElement("div");
    text.className = "desc";
    const where = document.createElement("span");
    where.className = "where";
    where.textContent = row.tile;
    const body = document.createElement("p");
    const confirm = act.confirm || {};
    let sentence = confirm.body || confirm.title || "";
    if (!act.enabled && act.why) sentence = (sentence ? sentence + " " : "") + "(" + act.why + ")";
    body.textContent = sentence;
    text.appendChild(where);
    text.appendChild(body);
    const note = document.createElement("p");
    note.className = "note";
    if (act.id === sentId) note.textContent = "sent";
    b.onclick = function () { run(act); };
    line.appendChild(b);
    line.appendChild(text);
    line.appendChild(note);
    list.appendChild(line);
  });
}

function markWorking(id) {
  viewGen++;
  sentId = id;
  if (!snap) return;
  (snap.tiles || []).forEach(function (t) {
    const gpu = t.id === "gpu" && (id === "os_windows" || id === "os_linux" || id === "gpu_power");
    if (gpu) {
      t.state = "busy";
      t.big = "...";
    }
    (t.pages || []).forEach(function (page) {
      if (gpu) {
        (page.rows || []).forEach(function (row) {
          if (row && row[0] === "os") {
            row[1] = "starting";
            row[2] = "busy";
          }
        });
      }
      (page.actions || []).forEach(function (act) {
        if (act.id === id) {
          act.enabled = false;
          act.why = "busy";
          act.current = false;
        }
      });
    });
  });
  paint();
}

function run(act) {
  const title = (act.confirm && act.confirm.title) || act.label;
  const body = (act.confirm && act.confirm.body) || "";
  if (!window.confirm(body ? title + "\n\n" + body : title)) return;
  markWorking(act.id);
  const gen = viewGen;
  fetch("/api/actions", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({id: act.id})
  }).then(function (r) {
    if (gen !== viewGen) return;
    if (!r.ok) sentId = "";
    return load();
  }).catch(function () {
    if (gen !== viewGen) return;
    sentId = "";
    load();
  });
}

async function load() {
  const gen = viewGen;
  try {
    const r = await fetch("/api/display");
    if (gen !== viewGen) return;
    if (!r.ok) throw new Error("http");
    snap = await r.json();
    if (gen !== viewGen) return;
    sentId = "";
    paint();
  } catch (e) {
    if (gen !== viewGen) return;
    document.getElementById("status").textContent = "no link";
    document.getElementById("status").className = "crit";
  }
}
load();
setInterval(load, 15000);
</script>
</body>
</html>
