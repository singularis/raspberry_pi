<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LCD monitor</title>
<link rel="stylesheet" href="/static/style.css?v=7">
</head>
<body>
<main class="page">
  <header class="top">
    <p class="mark">LCD monitor</p>
    <h1 id="status">loading</h1>
    <p id="temp" class="weather"></p>
  </header>
  <div id="sections"></div>
</main>
<script>
const sections = document.getElementById("sections");
let snap = null;

function summary(s) {
  const n = s.summary || {};
  if (n.crit) return n.crit + " bad";
  if (n.warn) return n.warn + " warn";
  return "all ok";
}

function addRows(parent, rows) {
  const dual = rows.some(function (r) { return r.length > 3; });
  if (dual) {
    const h = document.createElement("div");
    h.className = "row dual head";
    const a = document.createElement("span");
    const b = document.createElement("span");
    b.textContent = "now";
    const c = document.createElement("span");
    c.textContent = "prev";
    h.appendChild(a);
    h.appendChild(b);
    h.appendChild(c);
    parent.appendChild(h);
  }
  rows.forEach(function (r) {
    const d = document.createElement("div");
    d.className = dual ? "row dual" : "row";
    const a = document.createElement("span");
    a.textContent = r[0] || "";
    const b = document.createElement("span");
    b.textContent = r[1] || "";
    b.className = r[2] || "ok";
    d.appendChild(a);
    d.appendChild(b);
    if (dual) {
      const c = document.createElement("span");
      c.textContent = r[3] || "";
      c.className = r[4] || "";
      d.appendChild(c);
    }
    parent.appendChild(d);
  });
}

function paint() {
  if (!snap) return;
  const y = window.scrollY;
  const st = document.getElementById("status");
  st.textContent = summary(snap);
  st.className = (snap.summary && snap.summary.crit) ? "crit" : (snap.summary && snap.summary.warn) ? "warn" : "ok";
  const bits = [];
  if (snap.temp_out) bits.push(snap.temp_out);
  if (snap.humidity) bits.push(snap.humidity);
  if (snap.pressure) bits.push(snap.pressure + " hPa");
  document.getElementById("temp").textContent = bits.join("   ");
  sections.innerHTML = "";
  (snap.tiles || []).forEach(function (t) {
    const sec = document.createElement("section");
    sec.className = "block " + (t.state || "off");
    const head = document.createElement("header");
    const h = document.createElement("h2");
    h.textContent = t.label || "";
    head.appendChild(h);
    if (t.cap) {
      const cap = document.createElement("span");
      cap.className = "cap";
      cap.textContent = t.cap;
      head.appendChild(cap);
    }
    const big = document.createElement("p");
    big.className = "big";
    big.textContent = t.big || "--";
    head.appendChild(big);
    sec.appendChild(head);
    const rows = document.createElement("div");
    rows.className = "rows";
    (t.pages || []).forEach(function (page) {
      addRows(rows, page.rows || []);
    });
    if (t.camera) {
      const rec = !!t.camera.recording;
      const camRows = [
        ["recording", rec ? "yes" : "no", rec ? "busy" : "ok"],
        ["phase", t.camera.phase || "idle", "ok"]
      ];
      if (rec) {
        const s = t.camera.elapsed_s || 0;
        const mm = String(Math.floor(s / 60)).padStart(2, "0");
        const ss = String(s % 60).padStart(2, "0");
        camRows.push(["time", mm + ":" + ss, "busy"]);
      }
      addRows(rows, camRows);
    }
    sec.appendChild(rows);
    const actions = document.createElement("div");
    actions.className = "actions";
    const note = document.createElement("p");
    note.className = "note";
    (t.pages || []).forEach(function (page) {
      (page.actions || []).forEach(function (act) {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = act.label;
        b.disabled = !act.enabled;
        b.onclick = function () { run(act, note); };
        actions.appendChild(b);
      });
    });
    if (actions.childElementCount) {
      sec.appendChild(actions);
      sec.appendChild(note);
    }
    sections.appendChild(sec);
  });
  window.scrollTo(0, y);
}

async function run(act, note) {
  const title = (act.confirm && act.confirm.title) || act.label;
  if (!window.confirm(title)) return;
  note.textContent = "sending";
  const r = await fetch("/api/actions", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({id: act.id})
  });
  note.textContent = r.ok ? (act.id === "wake" ? "magic packet sent" : "sent") : "failed";
}

async function load() {
  try {
    const r = await fetch("/api/display");
    if (!r.ok) throw new Error("http");
    snap = await r.json();
    paint();
  } catch (e) {
    document.getElementById("status").textContent = "no link";
    document.getElementById("status").className = "crit";
  }
}
load();
setInterval(load, 15000);
</script>
</body>
</html>
