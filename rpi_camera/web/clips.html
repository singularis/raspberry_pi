<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Clips</title>
<link rel="stylesheet" href="/web/style.css?v=del">
</head>
<body>
<div id="top"><a class="btn" href="/">Live</a><span>Clips (camera off)</span></div>
<div id="stage"><img id="p" alt=""></div>
<div id="list">__LIST__</div>
<script>
document.getElementById('list').onclick=function(e){
  var del=e.target.closest('button.del');
  if(del){
    var name=del.getAttribute('data-f');
    var row=del.closest('.row');
    fetch('/delete?f='+encodeURIComponent(name),{method:'POST'}).then(function(r){
      if(!r.ok)return;
      if(row)row.remove();
      var p=document.getElementById('p');
      if((p.getAttribute('src')||'').indexOf(encodeURIComponent(name))>=0)p.removeAttribute('src');
      if(!document.querySelector('#list .row')){
        var empty=document.createElement('p');
        empty.className='empty';
        empty.textContent='No clips yet';
        document.getElementById('list').appendChild(empty);
      }
    });
    return;
  }
  var b=e.target.closest('button[data-f]');
  if(!b)return;
  document.getElementById('p').src='/clip/'+encodeURIComponent(b.getAttribute('data-f'));
};
</script>
</body>
</html>
